<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AutoAgent Trace Viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e8ec; --muted: #8b93a3;
    --reasoning: #5b8def; --tool_call: #d9a441; --tool_result: #4caf7d; --final: #c96bd6;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; padding: 24px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .picker { margin-bottom: 20px; }
  input[type=file] { color: var(--muted); }
  .step {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
  }
  .step-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .badge {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px;
    color: #0f1115;
  }
  .badge.reasoning { background: var(--reasoning); }
  .badge.tool_call { background: var(--tool_call); }
  .badge.tool_result { background: var(--tool_result); }
  .badge.final { background: var(--final); }
  .step-num { color: var(--muted); font-size: 12px; }
  .content {
    white-space: pre-wrap; font-size: 13.5px; line-height: 1.5;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: #d7dae1; max-height: 260px; overflow-y: auto;
  }
  .final-box {
    background: var(--panel); border: 1px solid var(--final);
    border-radius: 10px; padding: 16px; margin-top: 20px;
  }
  .final-box h2 { margin-top: 0; font-size: 15px; color: var(--final); }
  .final-box .content { max-height: none; white-space: pre-wrap; font-family: inherit; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AutoAgent Trace Viewer</h1>
  <div class="meta">Load a JSON file from the <code>runs/</code> folder to inspect a session.</div>
  <div class="picker"><input type="file" id="fileInput" accept="application/json"></div>
  <div id="summary"></div>
  <div id="steps"></div>
  <div id="finalOutput"></div>
</div>

<script>
document.getElementById('fileInput').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (evt) {
    try {
      const data = JSON.parse(evt.target.result);
      render(data);
    } catch (err) {
      document.getElementById('summary').textContent = 'Could not parse file: ' + err;
    }
  };
  reader.readAsText(file);
});

function render(data) {
  const summary = document.getElementById('summary');
  summary.innerHTML = `
    <div class="meta">
      <strong>Goal:</strong> ${escapeHtml(data.goal)}<br>
      Model: ${data.model} · Max steps: ${data.max_steps} · Stopped: ${data.stopped_reason || 'in progress'}
    </div>`;

  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = '';
  (data.steps || []).forEach(s => {
    const div = document.createElement('div');
    div.className = 'step';
    const content = typeof s.content === 'string' ? s.content : JSON.stringify(s.content, null, 2);
    div.innerHTML = `
      <div class="step-header">
        <span class="badge ${s.kind}">${s.kind.replace('_', ' ')}</span>
        <span class="step-num">step ${s.step}</span>
      </div>
      <div class="content">${escapeHtml(content)}</div>`;
    stepsEl.appendChild(div);
  });

  const finalEl = document.getElementById('finalOutput');
  finalEl.innerHTML = data.final_output
    ? `<div class="final-box"><h2>Final Output</h2><div class="content">${escapeHtml(data.final_output)}</div></div>`
    : '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
